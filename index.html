<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Practice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f7f4;
      --card: #fff;
      --text: #1a1a1a;
      --muted: #666;
      --border: #e0dbd4;
      --accent: #4a6fa5;
      --success: #2e7d4f;
      --error: #b5341e;
      --success-bg: #edf7f1;
      --error-bg: #fdf0ed;
    }

    body {
      font-family: 'Georgia', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 6rem;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      font-weight: normal;
      letter-spacing: 0.04em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-style: italic;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    .word-list {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .word-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.6rem 1.8rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      position: relative;
    }

    .word-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
    }

    .word-number {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
      min-width: 1.4rem;
    }

    .speak-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .speak-btn:hover { opacity: 0.85; }

    .word-label {
      font-size: 1rem;
      color: var(--muted);
      font-style: italic;
      flex: 1;
    }

    .delete-word-btn {
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: color 0.15s;
      line-height: 1;
    }
    .delete-word-btn:hover { color: var(--error); }

    .section-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .speak-btn-sm {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      margin-top: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .speak-btn-sm:hover { background: var(--accent); color: #fff; }

    .syllables {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
      flex: 1;
    }

    .syllable {
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .dot {
      color: var(--muted);
      font-size: 1.3rem;
      line-height: 1;
      user-select: none;
    }

    .definition {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.55;
      border-left: 3px solid var(--border);
      padding-left: 0.75rem;
      font-style: italic;
      flex: 1;
    }

    .spelling-tip {
      background: #f5f2ec;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #3a3020;
      flex: 1;
    }

    .spelling-tip strong {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .practice {
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .practice input {
      flex: 1;
      min-width: 200px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.8rem;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .practice input:focus { border-color: var(--accent); }

    .check-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .check-btn:hover { opacity: 0.85; }

    .clear-btn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.8rem;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .clear-btn:hover { opacity: 0.7; }

    .feedback {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.55rem 0.8rem;
      border-radius: 6px;
      font-size: 0.92rem;
      display: none;
    }
    .feedback.correct {
      display: block;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid #b5dfc8;
    }
    .feedback.incorrect {
      display: block;
      background: var(--error-bg);
      color: var(--error);
      border: 1px solid #f0c4bb;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.75rem 1.4rem;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(74,111,165,0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 100;
    }
    .fab:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    .modal h2 {
      font-size: 1.2rem;
      font-weight: normal;
      margin-bottom: 1.4rem;
      color: var(--text);
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: var(--accent); }

    .word-lookup-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .word-lookup-row input { flex: 1; }

    .lookup-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .lookup-btn:hover { background: var(--accent); color: #fff; }
    .lookup-btn:disabled { opacity: 0.5; cursor: default; }

    .lookup-status {
      font-size: 0.8rem;
      margin-top: 0.3rem;
      min-height: 1.1em;
    }
    .lookup-status.ok { color: var(--success); }
    .lookup-status.err { color: var(--error); }

    .form-hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.3rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .btn-cancel {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }

    .modal-error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 0.5rem;
      display: none;
    }
    .modal-error.visible { display: block; }
  </style>
</head>
<body>

<h1>Spelling Practice</h1>
<p class="subtitle">Click the speaker to hear a word, then type it correctly.</p>

<p id="pageStatus" style="text-align:center;color:var(--muted);font-style:italic;font-size:0.9rem;min-height:1.4em;margin-bottom:1rem"></p>
<div class="word-list" id="wordList"></div>

<button class="fab" id="addWordBtn">&#43; Add Word</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add a New Word</h2>
    <div class="form-group">
      <label>Word</label>
      <div class="word-lookup-row">
        <input type="text" id="f-word" placeholder="e.g. renaissance" autocorrect="off" spellcheck="false" />
        <button type="button" class="lookup-btn" id="lookupBtn">Look up</button>
      </div>
      <div class="lookup-status" id="lookupStatus"></div>
    </div>
    <div class="form-group">
      <label>Syllables</label>
      <input type="text" id="f-syllables" placeholder="e.g. ren, ais, sance" autocorrect="off" spellcheck="false" />
      <div class="form-hint">Separate syllables with commas — edit if needed</div>
    </div>
    <div class="form-group">
      <label>Definition</label>
      <textarea id="f-definition" rows="3" placeholder="What does the word mean?"></textarea>
    </div>
    <div class="form-group">
      <label>How to remember it</label>
      <textarea id="f-tip" rows="4" placeholder="Tips, mnemonics, or patterns to help spell it…"></textarea>
    </div>
    <div class="modal-error" id="modalError">Please fill in the word and at least one syllable.</div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="button" class="btn-primary" id="saveWordBtn">Save Word</button>
    </div>
  </div>
</div>

<script>
  // ── Google Apps Script URL ──────────────────────────────────────────────────
  // After deploying the Apps Script web app, paste the URL here:
  const SCRIPT_URL = '';
  // ────────────────────────────────────────────────────────────────────────────

  const builtIn = [
    {
      word: "renaissance",
      syllables: ["ren", "ais", "sance"],
      definition: "A period of renewed interest in classical art, architecture, literature, and learning that began in 14th-century Italy and spread across Europe; also, any period of new growth or revived activity.",
      tip: "Break it into three parts you already know: REN (like \"wren\" the bird, minus the w) + AIS (sounds like \"ace\") + SANCE (sounds like \"sonce\"). The double S in the middle is the most common stumble. Say to yourself: \"WREN — ACE — SANCE.\""
    },
    {
      word: "Michelangelo",
      syllables: ["Mi", "chel", "an", "ge", "lo"],
      definition: "Italian Renaissance artist (1475–1564) renowned for painting the Sistine Chapel ceiling, sculpting David and the Pietà, and designing the dome of St. Peter's Basilica.",
      tip: "Five syllables, all short: MI-CHEL-AN-GE-LO. Think of a chant — like clapping each beat. The tricky part is the CH (which sounds like K) and remembering the E before L-O at the end. Picture: \"My shell — angel — oh!\""
    }
  ];

  // Sheet API helpers
  async function sheetFetch(params) {
    if (!SCRIPT_URL) return null;
    const url = new URL(SCRIPT_URL);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    if (!res.ok) throw new Error('Sheet request failed');
    return res.json();
  }

  async function sheetPost(body) {
    if (!SCRIPT_URL) return null;
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('Sheet request failed');
    return res.json();
  }

  async function loadCustomWords() {
    if (!SCRIPT_URL) return [];
    try {
      const data = await sheetFetch({ action: 'list' });
      return data || [];
    } catch { return []; }
  }

  async function addWordToSheet(entry) {
    return sheetPost({ action: 'add', ...entry, syllables: entry.syllables.join('|') });
  }

  async function deleteWordFromSheet(word) {
    return sheetPost({ action: 'delete', word });
  }

  async function deleteCustomWord(word) {
    setStatus('Removing…');
    try { await deleteWordFromSheet(word); } catch { /* ignore */ }
    await renderAll();
    setStatus('');
  }

  // TTS
  const synth = window.speechSynthesis;
  function speak(text) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85;
    synth.speak(u);
  }

  function checkSpelling(word, input, feedbackEl) {
    const typed = input.value.trim();
    if (!typed) return;
    const correct = typed.toLowerCase() === word.toLowerCase();
    feedbackEl.className = 'feedback ' + (correct ? 'correct' : 'incorrect');
    feedbackEl.textContent = correct
      ? '✓ Correct! Well done.'
      : `✗ Not quite. You wrote "${typed}" — try again.`;
    input.style.borderColor = correct ? '#2e7d4f' : '#b5341e';
  }

  function clearEntry(input, feedbackEl) {
    input.value = '';
    input.style.borderColor = '';
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    input.focus();
  }

  function smallSpeakBtn(text, title) {
    const btn = document.createElement('button');
    btn.className = 'speak-btn-sm';
    btn.title = title;
    btn.innerHTML = '&#128266;';
    btn.addEventListener('click', () => speak(text));
    return btn;
  }

  function sectionRow(...children) {
    const row = document.createElement('div');
    row.className = 'section-row';
    children.forEach(c => row.appendChild(c));
    return row;
  }

  function buildCard(entry, index, isCustom) {
    const card = document.createElement('div');
    card.className = 'word-card';

    const header = document.createElement('div');
    header.className = 'word-header';

    const num = document.createElement('span');
    num.className = 'word-number';
    num.textContent = (index + 1) + '.';

    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.title = 'Hear the word';
    speakBtn.innerHTML = '&#128266;';
    speakBtn.addEventListener('click', () => speak(entry.word));

    const label = document.createElement('span');
    label.className = 'word-label';
    label.textContent = 'Click the speaker to hear the word';

    header.append(num, speakBtn, label);

    if (isCustom) {
      const delBtn = document.createElement('button');
      delBtn.className = 'delete-word-btn';
      delBtn.title = 'Remove this word';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        if (confirm(`Remove "${entry.word}" from the list?`)) deleteCustomWord(entry.word);
      });
      header.appendChild(delBtn);
    }

    // Syllables
    const syllablesEl = document.createElement('div');
    syllablesEl.className = 'syllables';
    entry.syllables.forEach((syl, i) => {
      const s = document.createElement('span');
      s.className = 'syllable';
      s.textContent = syl;
      syllablesEl.appendChild(s);
      if (i < entry.syllables.length - 1) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.textContent = '•';
        syllablesEl.appendChild(dot);
      }
    });
    const syllablesRow = sectionRow(
      smallSpeakBtn(entry.syllables.join(' ... '), 'Hear syllables'),
      syllablesEl
    );

    // Definition
    const defEl = document.createElement('div');
    defEl.className = 'definition';
    defEl.textContent = entry.definition || '—';
    const defRow = sectionRow(
      smallSpeakBtn(entry.definition || entry.word, 'Hear definition'),
      defEl
    );

    // Spelling tip
    const tipEl = document.createElement('div');
    tipEl.className = 'spelling-tip';
    tipEl.innerHTML = '<strong>How to remember it</strong>' + (entry.tip || '—');
    const tipRow = sectionRow(
      smallSpeakBtn(entry.tip || entry.word, 'Hear spelling tip'),
      tipEl
    );

    // Practice
    const practice = document.createElement('div');
    practice.className = 'practice';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Type the word here…';
    input.autocomplete = 'off';
    input.autocorrect = 'off';
    input.spellcheck = false;

    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn';
    checkBtn.textContent = 'Check';

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = 'Clear';

    const feedback = document.createElement('div');
    feedback.className = 'feedback';

    checkBtn.addEventListener('click', () => checkSpelling(entry.word, input, feedback));
    clearBtn.addEventListener('click', () => clearEntry(input, feedback));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkSpelling(entry.word, input, feedback);
    });

    practice.append(input, checkBtn, clearBtn, feedback);
    card.append(header, syllablesRow, defRow, tipRow, practice);
    return card;
  }

  function setStatus(msg) {
    document.getElementById('pageStatus').textContent = msg;
  }

  async function renderAll() {
    const list = document.getElementById('wordList');
    if (!SCRIPT_URL) {
      list.innerHTML = '<p style="text-align:center;color:var(--muted);font-style:italic;padding:2rem">Configure the Google Apps Script URL to load words.</p>';
      return;
    }
    setStatus('Loading…');
    const custom = await loadCustomWords();
    list.innerHTML = '';
    const all = [...builtIn, ...custom];
    all.forEach((entry, i) => {
      const isCustom = i >= builtIn.length;
      list.appendChild(buildCard(entry, i, isCustom));
    });
    setStatus('');
  }

  // Modal
  const overlay = document.getElementById('modalOverlay');
  const modalError = document.getElementById('modalError');

  // Simple English syllable splitter (vowel-cluster based)
  function splitSyllables(word) {
    const w = word.toLowerCase();
    const parts = [];
    const vowels = 'aeiouy';
    let chunk = '';
    let i = 0;
    while (i < w.length) {
      chunk += w[i];
      const isVowel = vowels.includes(w[i]);
      const nextIsVowel = vowels.includes(w[i + 1] || '');
      const afterNextIsVowel = vowels.includes(w[i + 2] || '');
      if (isVowel && !nextIsVowel && afterNextIsVowel && chunk.length > 1) {
        parts.push(chunk);
        chunk = '';
      } else if (!isVowel && nextIsVowel && parts.length > 0 && chunk.length > 2) {
        parts.push(chunk.slice(0, -1));
        chunk = chunk.slice(-1);
      }
      i++;
    }
    if (chunk) parts.push(chunk);
    return parts.length > 1 ? parts : [word.toLowerCase()];
  }

  async function lookupWord() {
    const word = document.getElementById('f-word').value.trim();
    if (!word) return;
    const btn = document.getElementById('lookupBtn');
    const status = document.getElementById('lookupStatus');
    btn.disabled = true;
    btn.textContent = 'Looking up…';
    status.className = 'lookup-status';
    status.textContent = '';
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
      if (!res.ok) throw new Error('not found');
      const data = await res.json();
      const entry = data[0];

      // Definition: first definition from first meaning
      const meaning = entry.meanings?.[0];
      const def = meaning?.definitions?.[0]?.definition || '';
      const partOfSpeech = meaning?.partOfSpeech || '';
      if (def) document.getElementById('f-definition').value = partOfSpeech ? `(${partOfSpeech}) ${def}` : def;

      // Syllables: try phonetic text, else fall back to splitter
      const phonetic = entry.phonetic || entry.phonetics?.find(p => p.text)?.text || '';
      // Phonetic like /ˌren.əˈsɑːns/ — extract dot-separated segments if present
      const dotMatch = phonetic.replace(/[\/\[\]ˌˈ]/g, '').split('.');
      const sylField = document.getElementById('f-syllables');
      if (dotMatch.length > 1) {
        sylField.value = dotMatch.map(s => s.trim()).filter(Boolean).join(', ');
      } else {
        sylField.value = splitSyllables(word).join(', ');
      }

      status.className = 'lookup-status ok';
      status.textContent = '✓ Definition loaded — review and edit as needed.';
    } catch {
      // Fall back to syllable splitter only
      document.getElementById('f-syllables').value = splitSyllables(word).join(', ');
      status.className = 'lookup-status err';
      status.textContent = '✗ Word not found in dictionary. Syllables estimated — please check.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Look up';
    }
  }

  document.getElementById('lookupBtn').addEventListener('click', lookupWord);
  document.getElementById('f-word').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); lookupWord(); }
  });

  document.getElementById('addWordBtn').addEventListener('click', () => {
    document.getElementById('f-word').value = '';
    document.getElementById('f-syllables').value = '';
    document.getElementById('f-definition').value = '';
    document.getElementById('f-tip').value = '';
    modalError.classList.remove('visible');
    overlay.classList.add('open');
    setTimeout(() => document.getElementById('f-word').focus(), 50);
  });

  document.getElementById('cancelBtn').addEventListener('click', () => {
    overlay.classList.remove('open');
  });

  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') overlay.classList.remove('open');
  });

  document.getElementById('saveWordBtn').addEventListener('click', async () => {
    const word = document.getElementById('f-word').value.trim();
    const syllablesRaw = document.getElementById('f-syllables').value.trim();
    const definition = document.getElementById('f-definition').value.trim();
    const tip = document.getElementById('f-tip').value.trim();

    if (!word || !syllablesRaw) {
      modalError.classList.add('visible');
      return;
    }

    const saveBtn = document.getElementById('saveWordBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';

    const syllables = syllablesRaw.split(',').map(s => s.trim()).filter(Boolean);
    try {
      await addWordToSheet({ word, syllables, definition, tip });
    } catch {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Word';
      modalError.textContent = 'Could not save to sheet — check your Script URL.';
      modalError.classList.add('visible');
      return;
    }

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Word';
    overlay.classList.remove('open');
    await renderAll();

    setTimeout(() => {
      const cards = document.querySelectorAll('.word-card');
      cards[cards.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  });

  renderAll();
</script>
</body>
</html>
